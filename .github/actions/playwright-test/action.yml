name: Playwright Test
description: Install Lightpanda and run a Playwright e2e test suite

inputs:
  command:
    description: The npm script to run (test:e2e:acceptance | test:e2e:smoke | test:e2e:regression)
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
    - run: npx lightpanda install
      shell: bash
    - run: npm run ${{ inputs.command }}
      shell: bash
    - uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: playwright-report-${{ inputs.command }}
        path: |
          playwright-report/
          test-results/
        retention-days: 7
        if-no-files-found: ignore
