version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    groups:
      tanstack:
        patterns:
          - "@tanstack/*"
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      major-updates:
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Groups are evaluated in order and a dependency joins the first match,
      # so the specific pattern must come before the catch-all.
      ci-workflows:
        patterns:
          - "The-Adult-In-The-Room/ci-workflows*"
      github-actions:
        patterns:
          - "*"
