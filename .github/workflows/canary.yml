# Canary workflow: runs ci-workflows reusable workflows against a supplied ref.
# Triggered by repository_dispatch from ci-workflows PRs.

name: Canary

on:
  repository_dispatch:
    types: [canary]

jobs:
  # Verify target: runs the verify workflow
  verify:
    name: canary / verify
    if: contains(fromJSON(github.event.client_payload.targets), 'verify')
    uses: The-Adult-In-The-Room/ci-workflows/.github/workflows/verify.yml@${{ github.event.client_payload.ref }}
    with:
      run-lighthouse: false
    secrets: inherit

  # Deploy target: runs deploy-and-smoke against the Railway canary environment
  deploy:
    name: canary / deploy
    if: contains(fromJSON(github.event.client_payload.targets), 'deploy')
    uses: The-Adult-In-The-Room/ci-workflows/.github/workflows/deploy-and-smoke.yml@${{ github.event.client_payload.ref }}
    with:
      project: ${{ vars.RAILWAY_CANARY_PROJECT }}
      service: ${{ vars.RAILWAY_SERVICE }}
      environment: canary
    secrets:
      railway-token: ${{ secrets.RAILWAY_CANARY_TOKEN }}
