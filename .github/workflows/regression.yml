name: Scheduled Regression Tests

on:
  schedule:
    # Run twice per day at 08:00 and 20:00 UTC.
    - cron: "0 8,20 * * *"
  workflow_dispatch:

jobs:
  regression:
    name: CI
    uses: The-Adult-In-The-Room/ci-workflows/.github/workflows/regression.yml@v2.1.1
    with:
      base-url: ${{ vars.REGRESSION_BASE_URL }}
      base-url-required: true
