name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write
  actions: write

jobs:
  CI:
    uses: The-Adult-In-The-Room/ci-workflows/.github/workflows/deploy-and-smoke.yml@v4.0.0
    with:
      project: ${{ vars.RAILWAY_PROJECT }}
      service: ${{ vars.RAILWAY_SERVICE }}
      environment: production
    secrets:
      railway-token: ${{ secrets.RAILWAY_TOKEN }}
